# ============================================
# 胜龙进销存系统 · Docker 编排
# 本地开发：docker compose up -d
# 服务器部署：同上，只需改 .env
# ============================================

services:
  # ---------- 数据库 ----------
  mysql:
    image: mysql:8.0
    container_name: shenglong-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-shenglong}
      MYSQL_USER: ${DB_USER:-shenglong}
      MYSQL_PASSWORD: ${DB_PASSWORD:-shenglong123}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=100
    ports:
      # 仅本机可连，不对公网暴露；本地用 3307 避免与已装 MySQL 冲突
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-rootpass}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - shenglong

  # ---------- 接口服务 ----------
  api:
    build:
      context: ./server
      args:
        # 国内网络可设为 docker.1panel.live/library/node:20-alpine
        BASE_IMAGE: ${NODE_BASE_IMAGE:-node:20-alpine}
    container_name: shenglong-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      TZ: Asia/Shanghai
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-shenglong}
      DB_USER: ${DB_USER:-shenglong}
      DB_PASSWORD: ${DB_PASSWORD:-shenglong123}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      WX_APPID: ${WX_APPID:-}
      WX_SECRET: ${WX_SECRET:-}
      UPLOAD_DIR: /app/uploads
      # ⚠️ 默认 false：容器内不开启开发者登录，防止用任意 openid 跳过微信登录
      ALLOW_DEV_LOGIN: ${ALLOW_DEV_LOGIN:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "3000:3000"
    volumes:
      - ./data/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - shenglong

  # ---------- 每日自动备份 ----------
  backup:
    image: mysql:8.0
    container_name: shenglong-backup
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_NAME: ${DB_NAME:-shenglong}
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      BACKUP_KEEP_DAYS: 30
      TZ: Asia/Shanghai
    volumes:
      - ./data/backup:/backup
      - ./server/scripts/backup.sh:/backup.sh:ro
    entrypoint: ["bash", "/backup.sh"]
    networks:
      - shenglong

volumes:
  mysql-data:
    driver: local

networks:
  shenglong:
    driver: bridge
